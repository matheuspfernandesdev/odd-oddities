name: Deploy to VPS

on:
  # push:
  #   branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << EOF
            set -e

            mkdir -p ~/.ssh
            if ! grep -q github.com ~/.ssh/known_hosts 2>/dev/null; then
              echo "Adding github.com to known_hosts..."
              ssh-keyscan -H github.com >> ~/.ssh/known_hosts
            fi

            mkdir -p "$VPS_DEPLOY_PATH"

            if [ -d "$VPS_DEPLOY_PATH/.git" ]; then
              cd $VPS_DEPLOY_PATH
              echo "Pulling latest code..."
              git pull origin main
            else
              echo "Cloning repository..."
              git clone git@github.com:matheuspfernandesdev/odd-oddities.git $VPS_DEPLOY_PATH
              cd $VPS_DEPLOY_PATH
            fi

            echo "Writing environment file..."
            cat > .env << 'ENVEOF'
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          TEXT_MODEL_ID=${{ vars.TEXT_MODEL_ID }}
          IMAGE_MODEL_ID=${{ vars.IMAGE_MODEL_ID }}
          META_APP_ID=${{ secrets.META_APP_ID }}
          META_APP_SECRET=${{ secrets.META_APP_SECRET }}
          META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID=${{ secrets.INSTAGRAM_USER_ID }}
          MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET_NAME=${{ secrets.MINIO_BUCKET_NAME }}
          STORAGE_DOMAIN=${{ secrets.STORAGE_DOMAIN }}
          TOKEN_ENCRYPTION_KEY=${{ secrets.TOKEN_ENCRYPTION_KEY }}
          SCHEDULE_HOUR_UTC=${{ vars.SCHEDULE_HOUR_UTC }}
          SCHEDULE_TIMEZONE=${{ vars.SCHEDULE_TIMEZONE }}
          SCHEDULE_DAYS=${{ vars.SCHEDULE_DAYS }}
          ENVEOF
            chmod 600 .env

            echo "Building and starting containers..."
            docker compose -f docker-compose.yml up -d --build

            echo "Deployment complete!"
            docker compose ps
            docker logs --tail 5 odd-oddities-worker
          EOF
